<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>織酒・無聲調酒師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#F5F0E8;
  --ink:#1A1410;
  --amber:#C8860A;
  --amber-light:#E8A820;
  --amber-pale:#FAF0D8;
  --muted:#6B5E4E;
  --glove:#F8F5F0;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:'Noto Sans TC',sans-serif}

/* ─── SCENES ─── */
.scene{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.8s ease;
}
.scene.active{opacity:1;pointer-events:all}

/* ─── GLOVES SVG ─── */
.gloves-wrap{
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:340px;
  pointer-events:none;
}
.gloves-wrap svg{width:100%;height:auto}
.glove-path{fill:var(--glove);stroke:#D4C8B0;stroke-width:1}

/* ─── SCENE 1 ─── */
#s1{background:var(--ink)}
#s1 .brand-wrap{
  text-align:center;
  position:relative;z-index:2;
  margin-bottom:80px;
}
.logo-main{
  font-family:'Ma Shan Zheng',serif;
  font-size:clamp(72px,12vw,140px);
  color:var(--cream);
  letter-spacing:0.15em;
  opacity:0;
  animation:inkDrop 1.8s cubic-bezier(.2,.8,.3,1) 0.5s forwards;
}
@keyframes inkDrop{
  0%{opacity:0;transform:translateY(-30px) scale(1.05);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.logo-sub{
  font-family:'Noto Serif TC',serif;
  font-size:14px;
  font-weight:300;
  color:var(--amber);
  letter-spacing:0.4em;
  margin-top:8px;
  opacity:0;
  animation:fadeUp 1s ease 2.2s forwards;
}
.tagline{
  font-family:'Noto Serif TC',serif;
  font-size:18px;
  font-weight:300;
  color:var(--cream);
  opacity:0.7;
  margin-top:32px;
  letter-spacing:0.2em;
  opacity:0;
  animation:fadeUp 1s ease 3s forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.btn-start{
  margin-top:48px;
  padding:14px 40px;
  background:transparent;
  border:1px solid var(--amber);
  color:var(--amber);
  font-family:'Noto Serif TC',serif;
  font-size:15px;
  letter-spacing:0.3em;
  cursor:pointer;
  opacity:0;
  animation:fadeUp 1s ease 3.6s forwards;
  transition:all 0.3s ease;
  position:relative;overflow:hidden;
}
.btn-start::before{
  content:'';position:absolute;inset:0;
  background:var(--amber);
  transform:translateX(-100%);
  transition:transform 0.4s ease;
  z-index:0;
}
.btn-start:hover::before{transform:translateX(0)}
.btn-start:hover{color:var(--ink)}
.btn-start span{position:relative;z-index:1}

/* gloves rise animation */
#s1 .gloves-wrap{
  transform:translateX(-50%) translateY(100%);
  animation:gloveRise 2s cubic-bezier(.2,.8,.3,1) 2s forwards;
}
@keyframes gloveRise{
  to{transform:translateX(-50%) translateY(30%)}
}

/* ambient particles */
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{
  position:absolute;
  width:2px;height:2px;
  background:var(--amber);
  border-radius:50%;
  opacity:0;
  animation:float var(--dur,8s) var(--del,0s) infinite ease-in-out;
}
@keyframes float{
  0%{opacity:0;transform:translateY(0) translateX(0)}
  20%{opacity:0.4}
  80%{opacity:0.2}
  100%{opacity:0;transform:translateY(-120vh) translateX(var(--dx,20px))}
}

/* ─── SCENE 2 ─── */
#s2{background:var(--cream)}
#s2 .content{
  width:min(600px,90vw);
  position:relative;z-index:2;
}
#s2 h2{
  font-family:'Noto Serif TC',serif;
  font-size:clamp(28px,5vw,48px);
  font-weight:300;
  color:var(--ink);
  margin-bottom:8px;
  letter-spacing:0.3em;
}
#s2 .prompt-label{
  font-family:'Noto Serif TC',serif;
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.3em;
  margin-bottom:24px;
}
#s2 .gloves-wrap{
  right:auto;left:auto;
  position:absolute;
  right:-60px;bottom:0;
  width:200px;
  transform:none;
  opacity:0.15;
}
textarea#story{
  width:100%;min-height:180px;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--amber);
  font-family:'Noto Serif TC',serif;
  font-size:16px;
  font-weight:300;
  color:var(--ink);
  line-height:2;
  letter-spacing:0.05em;
  resize:none;
  outline:none;
  padding:12px 0;
}
textarea#story::placeholder{color:var(--muted);opacity:0.6}
.char-count{
  font-family:'Noto Serif TC',serif;
  font-size:11px;color:var(--muted);
  text-align:right;margin-top:8px;
  letter-spacing:0.15em;
}
.demo-tags{
  display:flex;gap:8px;flex-wrap:wrap;
  margin:20px 0;
}
.demo-tag{
  padding:6px 16px;
  border:1px solid var(--amber);
  background:transparent;
  color:var(--amber);
  font-family:'Noto Serif TC',serif;
  font-size:12px;
  letter-spacing:0.25em;
  cursor:pointer;
  transition:all 0.2s;
}
.demo-tag:hover{background:var(--amber);color:white}
.btn-brew{
  width:100%;
  margin-top:24px;
  padding:16px;
  background:var(--ink);
  color:var(--cream);
  border:none;
  font-family:'Noto Serif TC',serif;
  font-size:14px;
  letter-spacing:0.4em;
  cursor:pointer;
  transition:all 0.3s;
}
.btn-brew:hover{background:var(--amber)}
.btn-brew:disabled{opacity:0.4;cursor:not-allowed}

/* ─── SCENE 3 ─── */
#s3{background:var(--ink)}
#s3 .brew-label{
  font-family:'Noto Serif TC',serif;
  font-size:13px;
  color:var(--amber);
  letter-spacing:0.5em;
  text-transform:uppercase;
  margin-bottom:32px;
}
.brew-dots{display:inline-flex;gap:6px;margin-left:8px}
.brew-dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--amber);
  animation:blink 1.2s var(--d,0s) infinite;
}
@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}

.card-cocktail{
  width:min(480px,90vw);
  background:var(--cream);
  padding:40px;
  position:relative;
  border-top:3px solid var(--amber);
}
.card-cocktail::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:3px;background:linear-gradient(90deg,var(--amber),var(--amber-light),var(--amber));
}
.cocktail-name{
  font-family:'Ma Shan Zheng',serif;
  font-size:clamp(28px,5vw,48px);
  color:var(--ink);
  letter-spacing:0.2em;
  margin-bottom:4px;
}
.cocktail-subtitle{
  font-family:'Noto Serif TC',serif;
  font-size:12px;
  color:var(--amber);
  letter-spacing:0.4em;
  margin-bottom:28px;
}
.section-label{
  font-size:10px;
  letter-spacing:0.4em;
  color:var(--muted);
  border-bottom:1px solid #D4C8B0;
  padding-bottom:8px;
  margin-bottom:16px;
  font-family:'Noto Sans TC',sans-serif;
}
.ingredients-list{
  list-style:none;
  margin-bottom:28px;
}
.ingredients-list li{
  font-family:'Noto Serif TC',serif;
  font-size:14px;
  color:var(--ink);
  padding:8px 0;
  border-bottom:1px dashed #D4C8B0;
  display:flex;justify-content:space-between;
  letter-spacing:0.05em;
}
.ingredients-list li span{color:var(--amber);font-size:12px}
.story-interp{
  font-family:'Noto Serif TC',serif;
  font-size:14px;
  color:var(--muted);
  line-height:2;
  letter-spacing:0.05em;
}

/* glove animation scene 3 */
#s3 .gloves-wrap{
  position:fixed;
  bottom:-20px;right:5%;left:auto;
  transform:none;
  width:220px;
  opacity:0.12;
  animation:gloveFloat 4s ease-in-out infinite;
}
@keyframes gloveFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-20px) rotate(2deg)}
}

/* ─── SCENE 4 ─── */
#s4{background:var(--ink)}
.video-frame{
  width:min(560px,90vw);
  aspect-ratio:9/16;
  max-height:60vh;
  background:#0d0a07;
  border:1px solid #333;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
}
.video-placeholder{
  text-align:center;
  color:var(--muted);
}
.video-placeholder .icon{
  font-size:48px;
  margin-bottom:16px;
  opacity:0.3;
}
.video-placeholder p{
  font-family:'Noto Serif TC',serif;
  font-size:12px;
  letter-spacing:0.2em;
  opacity:0.5;
}
.share-card{
  width:min(480px,90vw);
  background:var(--ink);
  border:1px solid var(--amber);
  padding:24px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:20px;
}
.share-card .name{
  font-family:'Ma Shan Zheng',serif;
  font-size:28px;
  color:var(--cream);
  letter-spacing:0.2em;
}
.share-card .meta{
  font-family:'Noto Serif TC',serif;
  font-size:11px;
  color:var(--amber);
  letter-spacing:0.3em;
  margin-top:4px;
}
.btn-share{
  padding:10px 24px;
  background:transparent;
  border:1px solid var(--amber);
  color:var(--amber);
  font-family:'Noto Sans TC',sans-serif;
  font-size:12px;
  letter-spacing:0.2em;
  cursor:pointer;
  transition:all 0.2s;
}
.btn-share:hover{background:var(--amber);color:var(--ink)}
.btn-again{
  width:min(480px,90vw);
  margin-top:12px;
  padding:14px;
  background:transparent;
  border:1px solid #444;
  color:var(--muted);
  font-family:'Noto Serif TC',serif;
  font-size:12px;
  letter-spacing:0.4em;
  cursor:pointer;
  transition:all 0.3s;
}
.btn-again:hover{border-color:var(--cream);color:var(--cream)}

/* nav dots */
.nav-dots{
  position:fixed;right:24px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;
  z-index:100;
}
.nav-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(200,134,10,0.3);
  transition:all 0.3s;
  cursor:pointer;
}
.nav-dot.active{background:var(--amber);transform:scale(1.5)}

/* back btn */
.btn-back{
  position:fixed;left:24px;top:24px;
  background:transparent;border:none;
  color:var(--amber);
  font-family:'Noto Sans TC',sans-serif;
  font-size:12px;
  letter-spacing:0.2em;
  cursor:pointer;
  z-index:100;
  opacity:0;
  transition:opacity 0.3s;
  display:flex;align-items:center;gap:6px;
}
.btn-back.visible{opacity:1}
.btn-back:hover{color:var(--amber-light)}

/* loading overlay */
#loading{
  position:fixed;inset:0;
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  opacity:1;
  transition:opacity 0.6s;
}
#loading.hide{opacity:0;pointer-events:none}

/* error toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:#2a1a0a;
  border:1px solid var(--amber);
  color:var(--amber);
  font-family:'Noto Serif TC',serif;
  font-size:13px;
  letter-spacing:0.1em;
  padding:12px 24px;
  z-index:300;
  opacity:0;
  transition:opacity 0.4s;
}
.toast.show{opacity:1}

/* ─── WATERMARK ─── */
.watermark{
  position:fixed;bottom:16px;right:20px;
  font-family:'Noto Serif TC',serif;
  font-size:10px;
  color:rgba(200,134,10,0.3);
  letter-spacing:0.2em;
  z-index:50;
}

/* column layout helpers */
.col{display:flex;flex-direction:column;align-items:center;gap:0}

/* inkline divider */
.inkline{
  width:40px;height:1px;
  background:var(--amber);
  margin:16px auto;
  opacity:0.6;
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div style="text-align:center">
    <div style="font-family:'Ma Shan Zheng',serif;font-size:64px;color:var(--cream);letter-spacing:0.2em;opacity:0.8">織酒</div>
    <div style="font-family:'Noto Serif TC',serif;font-size:11px;color:var(--amber);letter-spacing:0.5em;margin-top:8px">LOADING</div>
  </div>
</div>

<!-- Nav dots -->
<div class="nav-dots" id="navDots">
  <div class="nav-dot active" onclick="goTo(1)"></div>
  <div class="nav-dot" onclick="goTo(2)"></div>
  <div class="nav-dot" onclick="goTo(3)"></div>
  <div class="nav-dot" onclick="goTo(4)"></div>
</div>

<!-- Back btn -->
<button class="btn-back" id="backBtn" onclick="goBack()">← 返回</button>

<!-- Watermark -->
<div class="watermark">織酒・無聲調酒師</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ─── SCENE 1: 首頁 ─── -->

<script>
// ════════════════════════════════════════════════
// ★ API KEY 設定區
// ════════════════════════════════════════════════

// ① Google Gemini API Key（免費）
//    → 去 https://aistudio.google.com/apikey → Create API Key → 複製貼上
const GEMINI_API_KEY = "AIzaSyAvZGsmOZySa_g5zfR-wBW9Z3SI2QdKrW0";

// ② 可靈 (Kling AI) API Key
//    → 去 https://klingai.com → 開發者後台 → 取得以下兩組
const KLING_ACCESS_KEY  = "AENnMPJQaHmR8FRKtBprbQB4MJGDYkEY";
const KLING_SECRET_KEY  = "f4EAeLBnTeE4HRL8CEnd9nJf8Chb9reT";

// ════════════════════════════════════════════════

const DEMO_STORIES={
  sad:`那天下午，我把他最後的語音訊息聽了二十七遍。不是想要找什麼答案，只是那個聲音還在，而人不在了。我坐在空蕩蕩的房間裡，窗外的光一點一點消失，我沒有開燈。`,
  joy:`今天我通過了！三年前失敗的考試，今天終於拿到成績單的那一刻，我在考場門口哭了出來。不是悲傷，是那種壓了很久的東西突然鬆開的感覺。我打電話給媽媽，她說：我知道你可以的。`,
  longing:`每年春天，她都會寄一盒她家鄉的酥糖給我。今年的盒子到了，我卻捨不得打開。打開了，就是這一年最後一次感覺她還在。`,
  lonely:`在台北住了五年，認識很多人，卻覺得沒有一個人真的認識我。週末的夜晚最安靜，不是因為安靜，而是因為喧囂都是別人的。我常常一個人走路回家，假裝這是我選擇的。`,
  brave:`我辭掉了做了八年的工作。沒有下一份，沒有計畫，只有一個我藏了很久的夢。那天簽完離職單，走出辦公室，風吹過來，我第一次覺得，害怕和自由是同一件事。`
};

let currentScene=1;
let cocktailData={};

function goTo(n){
  if(n===currentScene)return;
  document.getElementById(`s${currentScene}`).classList.remove('active');
  document.getElementById(`s${n}`).classList.add('active');
  currentScene=n;
  document.querySelectorAll('.nav-dot').forEach((d,i)=>{
    d.classList.toggle('active',i===n-1);
  });
  document.getElementById('backBtn').classList.toggle('visible',n>1);
  // 進入 Scene 4 時自動觸發可靈影片生成
  if(n===4 && cocktailData && cocktailData.name){
    generateKlingVideo(cocktailData);
  }
}

function goBack(){
  if(currentScene>1)goTo(currentScene-1);
}

function updateCount(){
  const v=document.getElementById('story').value;
  document.getElementById('charNum').textContent=v.length;
  document.getElementById('brewBtn').disabled=v.trim().length<10;
}

function loadDemo(mood){
  document.getElementById('story').value=DEMO_STORIES[mood]||'';
  updateCount();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

async function startBrew(){
  const story=document.getElementById('story').value.trim();
  if(!story)return;
  goTo(3);
  document.getElementById('s3Brewing').style.display='block';
  document.getElementById('s3Result').style.display='none';

  const prompt=`你是一位無聲的東方調酒師，擅長將人的故事化為一杯酒。

請根據以下故事，創作一款專屬調酒：

故事：${story}

請以JSON格式回應，格式如下：
{
  "name": "調酒中文名稱（2-4個漢字，詩意）",
  "subtitle": "英文副標（4-6個英文詞）",
  "ingredients": [
    {"item": "材料名稱", "amount": "用量"},
    {"item": "材料名稱", "amount": "用量"},
    {"item": "材料名稱", "amount": "用量"},
    {"item": "材料名稱", "amount": "用量"}
  ],
  "interpretation": "對這個故事與這杯酒的詮釋，50-80字，文字風格詩意含蓄，帶有東方禪意"
}

只回傳JSON，不要有任何其他文字。`;

  try{
    const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{maxOutputTokens:1000,temperature:0.9}
      })
    });
    const data=await resp.json();
    const text=data.candidates[0].content.parts[0].text;
    const clean=text.replace(/```json|```/g,'').trim();
    cocktailData=JSON.parse(clean);
    renderCard(cocktailData);
  }catch(e){
    console.error(e);
    // fallback demo data
    cocktailData={
      name:"浮塵",
      subtitle:"Drifting Dust Martini",
      ingredients:[
        {item:"琴酒",amount:"45ml"},
        {item:"白苦艾酒",amount:"15ml"},
        {item:"竹鹽邊緣",amount:"少許"},
        {item:"白胡椒煙燻",amount:"一縷"}
      ],
      interpretation:"你的故事像一粒浮塵，在光裡可見，卻無處落腳。這杯酒用煙燻的虛無與鹽的真實，試著盛住那個瞬間。"
    };
    renderCard(cocktailData);
    showToast("無法連接API，顯示示範配方");
  }
}

function renderCard(d){
  document.getElementById('s3Brewing').style.display='none';
  document.getElementById('s3Result').style.display='flex';
  document.getElementById('cocktailName').textContent=d.name||'⋯';
  document.getElementById('cocktailSubtitle').textContent=d.subtitle||'';
  document.getElementById('shareCardName').textContent=d.name||'⋯';
  const ul=document.getElementById('ingredientsList');
  ul.innerHTML='';
  (d.ingredients||[]).forEach(ing=>{
    const li=document.createElement('li');
    li.innerHTML=`${ing.item}<span>${ing.amount}</span>`;
    ul.appendChild(li);
  });
  document.getElementById('storyInterp').textContent=d.interpretation||'';
}

// ─── 可靈影片生成 ───
function buildKlingPrompt(d){
  // 根據調酒名稱和故事詮釋，組出東方侘寂風格的影片 prompt
  return `A cinematic cocktail video in dark Japanese wabi-sabi aesthetic. A pair of elegant white-gloved hands slowly crafting a cocktail named "${d.name||'浮塵'}". Dark background, moss and stone props, amber liquid pouring into glass, soft moody lighting, dry ice smoke drifting, slow motion, film grain, silent bartender atmosphere. Style: dark editorial photography, oriental zen, 9:16 vertical video.`;
}

async function generateKlingVideo(d){
  document.getElementById('videoGenerating').style.display='block';
  document.getElementById('cocktailVideo').style.display='none';
  document.getElementById('videoError').style.display='none';

  const prompt = buildKlingPrompt(d);

  try{
    // 送出生成請求（透過 Vercel 後端）
    const createResp = await fetch('/api/kling',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ action:'create', prompt })
    });
    const createData = await createResp.json();
    const taskId = createData?.data?.task_id;
    if(!taskId) throw new Error('無法取得 task_id');

    await pollKlingVideo(taskId);

  }catch(e){
    console.error('可靈生成失敗:',e);
    document.getElementById('videoGenerating').style.display='none';
    document.getElementById('videoError').style.display='block';
    document.getElementById('videoLabel').textContent='影片生成失敗，請稍後再試';
  }
}

async function pollKlingVideo(taskId){
  const maxTry = 40;
  for(let i=0; i<maxTry; i++){
    await new Promise(r=>setTimeout(r,5000));
    try{
      const resp = await fetch('/api/kling',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ action:'check', taskId })
      });
      const data = await resp.json();
      const status = data?.data?.task_status;
      if(status==='succeed'){
        const videoUrl = data?.data?.task_result?.videos?.[0]?.url;
        if(videoUrl){
          document.getElementById('videoGenerating').style.display='none';
          const vid = document.getElementById('cocktailVideo');
          vid.src = videoUrl;
          vid.style.display='block';
          return;
        }
      }else if(status==='failed'){
        throw new Error('可靈回報失敗');
      }
    }catch(e){
      throw e;
    }
  }
  throw new Error('等待逾時');
}

function shareCard(){
  showToast("截圖功能：請使用系統截圖（期中報告Demo用）");
}

// Particles
function initParticles(){
  const c=document.getElementById('particles');
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText=`
      left:${Math.random()*100}%;
      top:${60+Math.random()*40}%;
      --dur:${6+Math.random()*8}s;
      --del:${Math.random()*6}s;
      --dx:${(Math.random()-0.5)*60}px;
      opacity:0;
    `;
    c.appendChild(p);
  }
}
initParticles();

// Hide loading after fonts load
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('loading').classList.add('hide');
  },800);
});
